# Full primary-track template. Run one frozen backbone/checkpoint per config,
# then compare runs with identical split manifests and contexts.
seed: 20261021
embedding_npz: data/arcface_embeddings.npz
output_dir: outputs/full_arcface
n_states: 128
k_candidates: [4, 8, 16, 32]
spectral_dim: 12
min_captures_per_identity: 2
max_identities_per_split: null
max_fit_identity_pairs: null
router_epochs: 120
router_batch_size: 512
router_lr: 0.001
router_hidden: [512, 256]
router_dropout: 0.10
router_patience: 20
phenomenon_permutations: 5000
phenomenon_match_quantile: 0.20
bootstrap_repetitions: 5000
run_continuous_baseline: true
continuous_bottleneck_dim: 16
continuous_epochs: 2000
run_image_neural_baseline: true
image_policy_epochs: 1500
image_policy_lr: 0.001
image_policy_hidden: [512, 256]
image_policy_dropout: 0.10
# Keep null for the primary run. If compute forces pair sampling, report it as
# an approximation and add pair-sampling uncertainty before making claims.
image_policy_max_identity_pairs: null
certification_delta: 0.05
gate_numerical_tolerance: 1.0e-8
# Set this before the primary run; zero tests non-inferiority only.
gate_decision_min_yield_gain: 0.0
splits:
  repr: 0.30
  fit: 0.25
  dev: 0.15
  cal: 0.15
  test: 0.15
contexts:
  - name: fmr_1e-2
    target_fmr: 0.01
    coverage_low: 0.50
    coverage_high: 1.0
    rho: 1.0
    reserve: 0.0
    identity_budget: null
    max_impostor_pairs_for_threshold: 2000000
  - name: fmr_1e-3
    target_fmr: 0.001
    coverage_low: 0.25
    coverage_high: 1.0
    rho: 1.0
    reserve: 0.0
    identity_budget: null
    max_impostor_pairs_for_threshold: 5000000
  # Enable only when the calibration identity budget makes a nonvacuous
  # certificate plausible. Otherwise the correct output is insufficient evidence.
  - name: fmr_1e-4
    target_fmr: 0.0001
    coverage_low: 0.10
    coverage_high: 1.0
    rho: 1.0
    reserve: 0.0
    identity_budget: null
    max_impostor_pairs_for_threshold: 10000000
