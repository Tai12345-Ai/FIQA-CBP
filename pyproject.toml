[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbp-full-extract"
version = "0.1.0"
description = "Certified Behavioral Partitions for evidence-aware face image quality assessment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "torch>=2.1",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "cvxpy>=1.4",
]

[project.optional-dependencies]
face = ["insightface>=0.7.3", "onnxruntime>=1.16"]
dev = ["pytest>=8.0"]

[project.scripts]
cbp = "cbp.cli:main"

[tool.setuptools.packages.find]
include = ["cbp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: slower end-to-end experiment tests (set CBP_RUN_INTEGRATION=1)",
]
